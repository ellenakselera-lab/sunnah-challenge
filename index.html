<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunnah Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-50">
    <div class="p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-6">
                <div class="flex items-center gap-3 mb-2">
                    <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <h1 class="text-3xl font-bold text-gray-800">Sunnah Challenge</h1>
                </div>
                <p class="text-gray-600">Catat aktivitas sunnah Anda dengan mudah</p>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="hidden bg-green-100 border border-green-400 text-green-700 px-6 py-4 rounded-xl mb-6 fade-in">
                <div class="flex items-center gap-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="font-medium">Data berhasil disimpan! Jazakallahu khairan 🤲</span>
                </div>
            </div>

            <!-- Form -->
            <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
                <!-- Nama -->
                <div class="mb-8">
                    <label class="block text-gray-700 font-semibold mb-3">
                        Nama Lengkap <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="text"
                        id="nama"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-emerald-500 focus:outline-none transition-colors"
                        placeholder="Masukkan nama lengkap"
                    />
                </div>

                <!-- Pilih Aktivitas -->
                <div class="mb-8">
                    <label class="block text-gray-700 font-semibold mb-3">
                        Pilih Aktivitas Sunnah <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <button
                            type="button"
                            onclick="toggleActivity('dhuha')"
                            id="activity-dhuha"
                            class="p-4 rounded-xl border-2 border-gray-200 hover:border-emerald-300 transition-all"
                        >
                            <div class="text-3xl mb-2">🤲</div>
                            <div class="font-medium text-gray-700">Sholat Dhuha</div>
                        </button>
                        <button
                            type="button"
                            onclick="toggleActivity('dzikir')"
                            id="activity-dzikir"
                            class="p-4 rounded-xl border-2 border-gray-200 hover:border-emerald-300 transition-all"
                        >
                            <div class="text-3xl mb-2">📿</div>
                            <div class="font-medium text-gray-700">Dzikir</div>
                        </button>
                    </div>
                </div>

                <!-- Calendar -->
                <div class="mb-8">
                    <label class="block text-gray-700 font-semibold mb-3">
                        Pilih Tanggal (bisa pilih lebih dari 1) <span class="text-red-500">*</span>
                    </label>
                    
                    <!-- Month Navigator -->
                    <div class="flex items-center justify-between mb-4 bg-emerald-50 p-3 rounded-xl">
                        <button
                            type="button"
                            onclick="changeMonth(-1)"
                            class="px-4 py-2 bg-white rounded-lg hover:bg-emerald-100 transition-colors font-medium"
                        >
                            ← Prev
                        </button>
                        <span id="currentMonth" class="font-bold text-lg text-gray-800"></span>
                        <button
                            type="button"
                            onclick="changeMonth(1)"
                            class="px-4 py-2 bg-white rounded-lg hover:bg-emerald-100 transition-colors font-medium"
                        >
                            Next →
                        </button>
                    </div>

                    <!-- Calendar Grid -->
                    <div id="calendar" class="grid grid-cols-7 gap-2"></div>

                    <!-- Selected dates summary -->
                    <div id="selectedDatesContainer" class="hidden mt-4 p-4 bg-emerald-50 rounded-xl">
                        <p class="font-semibold text-gray-700 mb-2">
                            Tanggal terpilih (<span id="dateCount">0</span>):
                        </p>
                        <div id="selectedDatesList" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button
                    type="button"
                    onclick="handleSubmit()"
                    id="submitBtn"
                    class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl hover:bg-emerald-700 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
                >
                    Kirim Data
                </button>
            </div>

            <!-- Footer Info -->
            <div class="mt-6 text-center text-gray-600 text-sm">
                <p>Data akan langsung tersimpan untuk rekap bulanan HR</p>
            </div>
        </div>
    </div>

    <script>
        // State management
        let state = {
            nama: '',
            selectedDates: [],
            activities: [],
            currentMonth: new Date()
        };

        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
                          'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

        // Initialize
        function init() {
            renderCalendar();
            document.getElementById('nama').addEventListener('input', (e) => {
                state.nama = e.target.value;
            });
        }

        // Toggle activity
        function toggleActivity(activityId) {
            const btn = document.getElementById(`activity-${activityId}`);
            const index = state.activities.indexOf(activityId);
            
            if (index > -1) {
                state.activities.splice(index, 1);
                btn.classList.remove('border-emerald-500', 'bg-emerald-50', 'shadow-md');
                btn.classList.add('border-gray-200');
            } else {
                state.activities.push(activityId);
                btn.classList.add('border-emerald-500', 'bg-emerald-50', 'shadow-md');
                btn.classList.remove('border-gray-200');
            }
        }

        // Change month
        function changeMonth(direction) {
            state.currentMonth.setMonth(state.currentMonth.getMonth() + direction);
            state.currentMonth = new Date(state.currentMonth);
            renderCalendar();
        }

        // Toggle date
        function toggleDate(dateStr) {
            const index = state.selectedDates.indexOf(dateStr);
            
            if (index > -1) {
                state.selectedDates.splice(index, 1);
            } else {
                state.selectedDates.push(dateStr);
            }
            
            state.selectedDates.sort();
            renderCalendar();
            updateSelectedDatesSummary();
        }

        // Render calendar
        function renderCalendar() {
            const year = state.currentMonth.getFullYear();
            const month = state.currentMonth.getMonth();
            
            // Update month display
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
            
            // Calculate calendar
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDayOfWeek = firstDay.getDay();
            
            // Build calendar HTML
            let calendarHTML = '';
            
            // Day names
            dayNames.forEach(day => {
                calendarHTML += `<div class="text-center font-semibold text-gray-600 text-sm py-2">${day}</div>`;
            });
            
            // Empty cells
            for (let i = 0; i < startingDayOfWeek; i++) {
                calendarHTML += '<div></div>';
            }
            
            // Days
            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = state.selectedDates.includes(dateStr);
                const isToday = today.getDate() === day && 
                               today.getMonth() === month && 
                               today.getFullYear() === year;
                
                let classes = 'aspect-square rounded-lg font-medium transition-all cursor-pointer ';
                if (isSelected) {
                    classes += 'bg-emerald-600 text-white shadow-lg scale-105';
                } else if (isToday) {
                    classes += 'bg-blue-100 text-blue-700 border-2 border-blue-300';
                } else {
                    classes += 'bg-gray-50 text-gray-700 hover:bg-emerald-100';
                }
                
                calendarHTML += `
                    <button
                        type="button"
                        onclick="toggleDate('${dateStr}')"
                        class="${classes}"
                    >
                        ${day}
                    </button>
                `;
            }
            
            document.getElementById('calendar').innerHTML = calendarHTML;
        }

        // Update selected dates summary
        function updateSelectedDatesSummary() {
            const container = document.getElementById('selectedDatesContainer');
            const list = document.getElementById('selectedDatesList');
            const count = document.getElementById('dateCount');
            
            if (state.selectedDates.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            count.textContent = state.selectedDates.length;
            
            list.innerHTML = state.selectedDates.map(dateStr => {
                const date = new Date(dateStr + 'T00:00:00');
                const formatted = date.toLocaleDateString('id-ID', { 
                    day: 'numeric', 
                    month: 'short', 
                    year: 'numeric' 
                });
                return `<span class="px-3 py-1 bg-emerald-200 text-emerald-800 rounded-lg text-sm font-medium">${formatted}</span>`;
            }).join('');
        }

        // Handle submit
        async function handleSubmit() {
            // Validation
            if (!state.nama.trim()) {
                alert('Mohon isi nama lengkap');
                return;
            }
            
            if (state.selectedDates.length === 0) {
                alert('Mohon pilih minimal 1 tanggal');
                return;
            }
            
            if (state.activities.length === 0) {
                alert('Mohon pilih minimal 1 aktivitas');
                return;
            }

            // Disable button
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Menyimpan...</span>';

            // Prepare data
            const submitData = {
                nama: state.nama,
                tanggal: state.selectedDates,
                aktivitas: state.activities,
                timestamp: new Date().toISOString()
            };

            console.log('Data submitted:', submitData);

            
            // Example: 
            // await fetch('YOUR_GOOGLE_SHEETS_ENDPOINT', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(submitData)
            // });

            // Simulate API call
            

            // Show success
            const successMsg = document.getElementById('successMessage');
            successMsg.classList.remove('hidden');
            
            // Reset form
            state = {
                nama: '',
                selectedDates: [],
                activities: [],
                currentMonth: new Date()
            };
            
            document.getElementById('nama').value = '';
            document.querySelectorAll('[id^="activity-"]').forEach(btn => {
                btn.classList.remove('border-emerald-500', 'bg-emerald-50', 'shadow-md');
                btn.classList.add('border-gray-200');
            });
            
            renderCalendar();
            updateSelectedDatesSummary();
            
            // Re-enable button
            btn.disabled = false;
            btn.innerHTML = 'Kirim Data';
            
            // Hide success message after 3 seconds
            setTimeout(() => {
                successMsg.classList.add('hidden');
            }, 3000);
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
